name: deps
on:
  pull_request_target:
permissions:
  contents: read
jobs:
  # pull_request_target exécute le workflow de main : la PR ne peut ni modifier ni retirer ce contrôle.
  # Aucun code de la PR n'est exécuté : ses manifestes sont lus comme données par git.
  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - run: python3 hooks/verifie-manifestes.py --ci --depot pr --base "$BASE" --cible HEAD
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
